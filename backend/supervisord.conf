[supervisord]
nodaemon=true
user=appuser

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
environment=PORT=7860
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=celery -A celery_worker.celery_app worker --loglevel=info --pool=solo --concurrency=1 --prefetch-multiplier=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
